services:

  python:
    build: .
    volumes:
      - ./Contabilidad_Empresa:/app/Contabilidad_Empresa
    env_file:
      - ./Contabilidad_Empresa/.env
    depends_on:
      - postgres
    command: tail -f /dev/null

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:





